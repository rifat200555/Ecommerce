<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Seller Login</title>
</head>
<body style="font-family: sans-serif; max-width: 320px; margin: 80px auto;">

  <h2>Seller Login</h2>

  <input id="email" type="email" placeholder="Email" style="width:100%; padding:8px; margin:6px 0;">
  <input id="password" type="password" placeholder="Password" style="width:100%; padding:8px; margin:6px 0;">
  <button id="loginBtn" style="width:100%; padding:10px;">Login</button>

  <p id="message" style="color: red;"></p>
  <p style="margin-top:20px;">
    Don't have an account?
    <a href="/register_seller.html">Create a seller account</a>
    &nbsp;|&nbsp;
    <a href="/register_customer.html">Register as a Customer</a>
  </p>
  
<script>
document.getElementById('loginBtn').addEventListener('click', async () => {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const message = document.getElementById('message');
  message.textContent = '';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      message.textContent = data.message;
      return;
    }

    // store the token so seller.html can use it
    localStorage.setItem('token', data.token);
    ///window.location.href = '/seller.html';
    window.location.href = data.redirect;

  } catch (err) {
    message.textContent = 'Could not reach the server';
  }
});
</script>
</body>
</html>
