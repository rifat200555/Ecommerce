<!DOCTYPE html>
<!-- =====================================================================
     public/wallet.html

     Read-only customer wallet balance and transaction history.
     ===================================================================== -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Wallet</title>
  <link rel="stylesheet" href="/seller.css">
</head>
<body>

<div class="layout" id="layout">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand hide-when-closed">CUSTOMER</div>
      <button id="toggleBtn" title="Toggle sidebar">&#9776;</button>
    </div>
    <div class="seller-box" id="sellerBox"></div>
    <nav class="nav">
      <a href="/products.html"><span class="ico">&#9635;</span><span class="hide-when-closed">Products</span></a>
      <a href="/cart.html"><span class="ico">&#9636;</span><span class="hide-when-closed">Cart</span></a>
      <a href="/wishlist.html"><span class="ico">&#9825;</span><span class="hide-when-closed">Wishlist</span></a>
      <a href="/addresses.html"><span class="ico">&#8962;</span><span class="hide-when-closed">Addresses</span></a>
      <a href="/orders.html"><span class="ico">&#9776;</span><span class="hide-when-closed">Orders</span></a>
      <a href="/wallet.html" class="active"><span class="ico">&#9670;</span><span class="hide-when-closed">Wallet</span></a>
      <a href="/search-history.html"><span class="ico">&#8981;</span><span class="hide-when-closed">Search History</span></a>
      <a href="/customer.html"><span class="ico">&#9679;</span><span class="hide-when-closed">My Account</span></a>
      <a href="#" class="logout" id="logoutBtn"><span class="ico">&#9099;</span><span class="hide-when-closed">Logout</span></a>
    </nav>
  </aside>

  <main class="main">
    <div class="pagehead"><h2>My Wallet</h2></div>
    <div id="toast" class="toast"></div>
    <div id="wallet" class="store-state">Loading wallet...</div>
  </main>
</div>

<script src="/panel-common.js"></script>
<script>
setupSidebar();
loadCustomerBox();

function fullDate(value) {
  if (!value) return '-';
  return new Date(value).toLocaleString();
}

function escapeHtml(value) {
  return String(value ?? '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function drawWallet(data) {
  const out = document.getElementById('wallet');
  if (!data.wallet) {
    out.className = 'store-state';
    out.textContent = 'No wallet exists for this customer account.';
    return;
  }

  let rows = '';
  for (const transaction of data.transactions) {
    const relatedOrder = transaction.OrderID
      ? `<a href="/order-details.html?id=${transaction.OrderID}">#${transaction.OrderID}</a>`
      : '-';
    rows += `<tr>
      <td>#${transaction.TransactionID}</td>
      <td>${escapeHtml(transaction.TransactionType)}</td>
      <td>${money(transaction.Amount)}</td>
      <td>${fullDate(transaction.TransactionDate)}</td>
      <td>${escapeHtml(transaction.Status)}</td>
      <td>${relatedOrder}</td>
    </tr>`;
  }

  out.className = '';
  out.innerHTML = `
    <div class="cards">
      <div class="card">
        <div class="label">Current balance</div>
        <div class="value">${money(data.wallet.CurrentBalance)}</div>
      </div>
      <div class="card">
        <div class="label">Reward points</div>
        <div class="value">${Number(data.wallet.RewardPoints).toLocaleString()}</div>
      </div>
      <div class="card">
        <div class="label">Last updated</div>
        <div style="font-size:16px;font-weight:bold;margin-top:9px;">${fullDate(data.wallet.LastUpdated)}</div>
      </div>
    </div>

    <div class="panel wide" style="overflow-x:auto;">
      <h3>Transaction history</h3>
      <table>
        <thead>
          <tr><th>Transaction</th><th>Type</th><th>Amount</th><th>Date</th><th>Status</th><th>Related order</th></tr>
        </thead>
        <tbody>${rows || '<tr><td colspan="6">No wallet transactions found.</td></tr>'}</tbody>
      </table>
    </div>`;
}

async function loadWallet() {
  const out = document.getElementById('wallet');
  try {
    const res = await authFetch('/api/customer/wallet');
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || 'Could not load wallet');
    drawWallet(data);
  } catch (err) {
    out.className = 'store-state';
    out.textContent = err.message;
    toast(err.message, true);
  }
}

loadWallet();
</script>
</body>
</html>
